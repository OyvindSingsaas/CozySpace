<script>
// ======================= data (static snapshot; later the live feed) =======================
const SNAP = [{"station":"Goldstone","dish":"DSS14","target":"DSN","signals":[]},{"station":"Goldstone","dish":"DSS25","target":"ESCG","signals":[{"dir":"up","rate":0,"power":0.2},{"dir":"down","rate":8000,"power":-120}]},{"station":"Goldstone","dish":"DSS26","target":"JWST","signals":[]},{"station":"Goldstone","dish":"DSS23","target":"MMS2","signals":[]},{"station":"Madrid","dish":"DSS55","target":"DSN","signals":[]},{"station":"Madrid","dish":"DSS54","target":"MSL","signals":[]},{"station":"Madrid","dish":"DSS63","target":"STA","signals":[{"dir":"up","rate":0,"power":10},{"dir":"down","rate":720000,"power":-120}]},{"station":"Madrid","dish":"DSS53","target":"LRO","signals":[]},{"station":"Madrid","dish":"DSS56","target":"SOHO","signals":[{"dir":"up","rate":0,"power":0.1},{"dir":"down","rate":245800,"power":-110}]},{"station":"Madrid","dish":"DSS65","target":"KPLO","signals":[{"dir":"up","rate":0,"power":0.2},{"dir":"down","rate":8192,"power":-110}]},{"station":"Canberra","dish":"DSS43","target":"VGR1","signals":[{"dir":"down","rate":159.4,"power":-170}]},{"station":"Canberra","dish":"DSS35","target":"WIND","signals":[{"dir":"up","rate":0,"power":0.2},{"dir":"down","rate":6400,"power":-130},{"dir":"down","rate":73510,"power":-130}]},{"station":"Canberra","dish":"DSS34","target":"SPP","signals":[{"dir":"up","rate":0,"power":18},{"dir":"down","rate":397500,"power":-140}]},{"station":"Canberra","dish":"DSS36","target":"ACE","signals":[{"dir":"up","rate":0,"power":0.1},{"dir":"down","rate":0,"power":-120}]}];

const STATIONS = { Goldstone:[-116.89,35.43], Madrid:[-4.25,40.43], Canberra:[148.98,-35.40] };
const NAMES = { ESCG:'ESCAPADE', JWST:'JWST', MMS2:'MMS', MSL:'Curiosity', STA:'STEREO-A', LRO:'LRO',
  SOHO:'SOHO', KPLO:'Danuri', VGR1:'Voyager 1', VGR2:'Voyager 2', WIND:'Wind', SPP:'Parker', ACE:'ACE' };
// where craft live, for any target the feed brings that isn't placed explicitly in sky()
const HOME = {
  MOON: ['LRO', 'KPLO', 'CAPS', 'THB', 'THC', 'CH2O', 'CH2L', 'SLIM', 'LUPX', 'BLUE', 'IM2', 'ORIO', 'ART2'],
  MARS: ['MRO', 'MVN', 'M20', 'MSL', 'ODY', 'TGO', 'MEX', 'EMM', 'M01O'],
  JUP:  ['JNO'],
  L1:   ['SOHO', 'ACE', 'WIND', 'DSCO', 'IMAP', 'AL1', 'SWFO', 'CARR'],
  L2:   ['JWST', 'EUCL', 'GAIA', 'SPHX', 'PLAT'],
  EARTH:['MMS1', 'MMS2', 'MMS3', 'MMS4', 'CHDR', 'TESS', 'GTL', 'XMM', 'IBEX', 'TDR', 'NSYT'],
};
const NOT_CRAFT = new Set(['DSN', 'DSS', '']);        // maintenance / testing placeholders in the feed
const homeOf = k => Object.keys(HOME).find(h => HOME[h].includes(k));
const ALWAYS_ORBITING = ['LRO', 'KPLO', 'MSL'];
// real periods (s): orbiters around their body; surface rovers turn with their planet's day
const ORBIT_PERIOD = { LRO: 113 * 60, KPLO: 118 * 60, CAPS: 6.5 * 86400, THB: 26 * 3600, THC: 26 * 3600,
  MRO: 112 * 60, ODY: 118 * 60, M01O: 118 * 60, MVN: 4.5 * 3600, TGO: 2 * 3600, MEX: 7 * 3600, EMM: 55 * 3600,
  MSL: 88775, M20: 88775, JNO: 33 * 86400 };                  // shown at their body even when quiet
const hash = (str, n = 1) => { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return mod(h * n, 1e6) / 1e6; };

// ======================= NOAA OVATION aurora =======================
// the live grid is reduced to the oval's shape: for each 3° bearing around each geomagnetic pole,
// an intensity-weighted mean distance from the pole and a peak intensity. the ribbon is drawn from that.
let AURORA = null;
function bearing([lo1, la1], [lo2, la2]) {
  const p1 = la1 * RAD, p2 = la2 * RAD, dl = (lo2 - lo1) * RAD;
  return mod(Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl)) / RAD, 360);
}
async function pollAurora() {
  if (document.hidden) { setTimeout(pollAurora, 10000); return; }
  try {
    const j = await (await fetch('https://services.swpc.noaa.gov/json/ovation_aurora_latest.json')).json();
    const NB = 120, mk = () => ({ w: new Float64Array(NB), rw: new Float64Array(NB), max: new Float64Array(NB) });
    const B = { N: mk(), S: mk() };
    for (const [lon, lat, v] of j.coordinates) {
      if (v < 2 || Math.abs(lat) < 35) continue;
      const pole = lat > 0 ? GEOMAG_N : GEOMAG_S, b = lat > 0 ? B.N : B.S;
      const dist = d3.geoDistance(pole, [lon, lat]) / RAD;
      if (dist > 45) continue;
      const i = Math.floor(bearing(pole, [lon, lat]) / 3) % NB;
      b.w[i] += v; b.rw[i] += v * dist; b.max[i] = Math.max(b.max[i], v);
    }
    const out = {};
    for (const h of ['N', 'S']) {
      const b = B[h], r = [], v = [];
      for (let i = 0; i < NB; i++) {                 // circular smoothing over ±4 bins, so gaps fill in gently
        let w = 0, rw = 0, m = 0, k = 0;
        for (let o = -4; o <= 4; o++) { const q = mod(i + o, NB); w += b.w[q]; rw += b.rw[q]; m += b.max[q]; k++; }
        r.push(w > 0 ? rw / w : null); v.push(Math.min(1.6, m / k / 22));
      }
      out[h] = { r, v };
    }
    AURORA = { ...out, at: j['Observation Time'] };
  } catch (e) { /* keep the model oval */ }
  setTimeout(pollAurora, 30 * 60 * 1000);
}
pollAurora();

// ======================= the ISS =======================
// orbit elements (TLE) from CelesTrak, refreshed twice a day; position propagated locally with SGP4 every frame
const ISS = { rec: null };
const ISS_FALLBACK = ['1 25544U 98067A   26306.75682168  .00005437  00000+0  10620-3 0  9990',
                      '2 25544  51.6331 334.3796 0007124 340.7366  19.3352 15.49154261593232'];
function setTLE(l1, l2) { try { if (window.satellite) ISS.rec = satellite.twoline2satrec(l1, l2); } catch (e) {} }
setTLE(...ISS_FALLBACK);
async function pollTLE() {
  try {
    const lines = (await (await fetch('https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE')).text()).split(/\r?\n/).map(x => x.trim());
    const i = lines.findIndex(x => x.startsWith('1 25544'));
    if (i >= 0 && lines[i + 1]?.startsWith('2 25544')) setTLE(lines[i], lines[i + 1]);
  } catch (e) { /* keep the last elements */ }
  setTimeout(pollTLE, 12 * 3600 * 1000);
}
pollTLE();
function issAt(t) {                               // -> [lon, lat], km altitude
  if (!ISS.rec || !window.satellite) return null;
  const d = new Date(t), pv = satellite.propagate(ISS.rec, d);
  if (!pv || !pv.position) return null;
  const g = satellite.eciToGeodetic(pv.position, satellite.gstime(d));
  return { ll: [satellite.degreesLong(g.longitude), satellite.degreesLat(g.latitude)], h: g.height };
}

// ======================= rocket launches =======================
// Launch Library 2 (The Space Devs): recent + upcoming launches with exact time and pad. polled every 30 min
// (the free API allows 15 calls an hour). a launch is shown from lift-off until ~9 min later, about when a
// real rocket reaches orbit, then it vanishes in a small pulse.
let LAUNCHES = [];
const ASCENT_S = 540;
async function pollLaunches() {
  if (document.hidden) { setTimeout(pollLaunches, 30000); return; }
  try {
    const j = await (await fetch('https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=15&mode=normal&hide_recent_previous=false')).json();
    LAUNCHES = (j.results || []).filter(x => x.pad && x.pad.latitude != null).map(x => {
      const [rocket, mission] = x.name.split('|').map(z => z.trim());
      return { id: x.id, t0: Date.parse(x.net), status: x.status?.abbrev || '', precise: ['Second', 'Minute'].includes(x.net_precision?.name),
               rocket, mission: mission || '', where: x.pad.location?.name?.split(',').slice(-1)[0].trim() || '',
               ll: [+x.pad.longitude, +x.pad.latitude], polar: ['PO', 'SSO'].includes(x.mission?.orbit?.abbrev) };
    });
  } catch (e) { /* keep what we have */ }
  setTimeout(pollLaunches, 30 * 60 * 1000);
}
function initLaunches() {                       // called once everything is defined
  if (params.has('launch')) {                    // ?launch : a demo launch from Cape Canaveral, lifting off 5 s after load
    LAUNCHES = [{ id: 'demo', t0: now() + 5000, status: 'Go', precise: true, rocket: 'Falcon 9', mission: 'demo', where: 'Florida',
                  ll: [-80.6, 28.6], polar: false }];
  } else pollLaunches();
}
const LAUNCHED = new Set();
const launchShown = L => (L.precise || L.status === 'Success') && !['TBD', 'TBC', 'Hold'].includes(L.status);

// ======================= live DSN feed =======================
let DISHES = SNAP, FRIENDLY = {}, FEED = { live: false, at: null };
const LINKS = new Map();                       // 'dish|target' -> link, eased in and out as the feed changes
const RIPPLES = [];                            // short-lived rings where something just happened
function ingest(list, quiet = false) {
  DISHES = list;
  const before = new Set([...LINKS].filter(([, L]) => L.want).map(([k]) => k));
  const prevTarget = Object.fromEntries((ingest.prev || []).map(d => [d.dish, d.target])); ingest.prev = list;
  for (const L of LINKS.values()) L.want = 0;
  for (const d of list) {
    if (!d.signals.length || !d.target || NOT_CRAFT.has(d.target)) continue;
    const key = d.dish + '|' + d.target, isNew = !LINKS.has(key), L = LINKS.get(key) || { alpha: 0 };
    if (isNew && !quiet) L.fresh = true;          // a contact that starts while we watch: its first packet sets out now
    LINKS.set(key, Object.assign(L, d, { want: 1 }));
  }
  if (quiet) return;
  const t0 = (Date.now() - T0) / 1000;
  for (const d of list) if (prevTarget[d.dish] !== undefined && prevTarget[d.dish] !== d.target)
    RIPPLES.push({ kind: 'slew', station: d.station, dish: d.dish, target: null, t0 });     // a dish swinging to a new target
  for (const [k, L] of LINKS) {
    if (L.want && !before.has(k)) RIPPLES.push({ kind: 'start', station: L.station, target: L.target, t0 });
    if (!L.want && before.has(k)) RIPPLES.push({ kind: 'end', station: L.station, target: L.target, t0 });
  }
}
ingest(SNAP, true);
let LIVE_FETCHES = 0;
async function pollDSN() {
  if (document.hidden) { setTimeout(pollDSN, 5000); return; }
  try {
    const r = await fetch('https://eyes.nasa.gov/dsn/data/dsn.xml?r=' + Date.now());
    const x = new DOMParser().parseFromString(await r.text(), 'text/xml'), list = [];
    let st = '';
    for (const e of x.documentElement.children) {
      if (e.tagName === 'station') st = e.getAttribute('friendlyName');
      else if (e.tagName === 'dish') {
        const t = e.querySelector('target');
        const signals = [...e.children]
          .filter(c => (c.tagName === 'upSignal' || c.tagName === 'downSignal') && c.getAttribute('active') === 'true')
          .map(c => ({ dir: c.tagName === 'upSignal' ? 'up' : 'down', rate: +c.getAttribute('dataRate') || 0,
                       power: +c.getAttribute('power') || 0, band: c.getAttribute('band') }));
        list.push({ station: st, dish: e.getAttribute('name'), target: t ? t.getAttribute('name').toUpperCase() : '',
                    rtlt: t ? +t.getAttribute('rtlt') : -1, signals,
                    az: +e.getAttribute('azimuthAngle') || 0, el: e.getAttribute('elevationAngle') === '' ? 90 : +e.getAttribute('elevationAngle') });
      }
    }
    if (list.length) { ingest(list, LIVE_FETCHES++ === 0); FEED = { live: true, at: Date.now() }; }   // the first live read only sets the scene
  } catch (e) { FEED.live = false; }
  setTimeout(pollDSN, 30000);
}
fetch('https://eyes.nasa.gov/dsn/config.xml').then(r => r.text()).then(t => {
  for (const sc of new DOMParser().parseFromString(t, 'text/xml').querySelectorAll('spacecraft'))
    FRIENDLY[sc.getAttribute('name').toUpperCase()] = sc.getAttribute('friendlyName');
}).catch(() => {});
pollDSN();
const nameOf = k => NAMES[k] || FRIENDLY[k] || k;
const GEOMAG_N = [-72.6, 80.8], GEOMAG_S = [107.4, -80.8];

// ======================= time =======================
const params = new URLSearchParams(location.search);
const SPEED = +params.get('speed') || 1;
const T0 = Date.now();
const FPS = +params.get('fps') || 24;
const OFFSET = (+params.get('offset') || 0) * 60000;     // ?offset=25 : look 25 minutes ahead
const now = () => T0 + OFFSET + (Date.now() - T0) * SPEED;
const J2000 = 946728000000, RAD = Math.PI / 180, C_KMS = 299792.458, AU = 1.495978707e8;
const mod = (a, m) => ((a % m) + m) % m;

// ======================= astronomy (low precision: a mood piece) =======================
function sun(t) {
  const n = (t - J2000) / 864e5;
  const L = 280.460 + 0.9856474 * n, g = (357.528 + 0.9856003 * n) * RAD;
  const lam = L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g);
  const eps = (23.439 - 4e-7 * n) * RAD, l = lam * RAD;
  const dec = Math.asin(Math.sin(eps) * Math.sin(l));
  const ra = Math.atan2(Math.cos(eps) * Math.sin(l), Math.cos(l)) / RAD;
  const gmst = 280.46061837 + 360.98564736629 * n;
  return { lam: mod(lam, 360), lon: mod(ra - gmst + 180, 360) - 180, lat: dec / RAD, n };
}
function helioToGeo(lh, rh, lsun) {            // heliocentric (deg, AU) -> geocentric ecliptic lon, km
  const le = (lsun + 180) * RAD;
  const x = rh * Math.cos(lh * RAD) - Math.cos(le), y = rh * Math.sin(lh * RAD) - Math.sin(le);
  return { lam: mod(Math.atan2(y, x) / RAD, 360), d: Math.hypot(x, y) * AU };
}
// JPL Horizons table (window.EPHEMERIS), interpolated; null outside its range -> callers fall back to formulas
function eph(key, t) {
  const E = window.EPHEMERIS, rows = E && E.objects[key];
  if (!rows) return null;
  const f = (t - Date.parse(E.start)) / (E.stepDays * 864e5);
  if (f < 0 || f > rows.length - 1) return null;
  const i = Math.min(rows.length - 2, Math.floor(f)), u = f - i, [l0, d0] = rows[i], [l1, d1] = rows[i + 1];
  return { lam: mod(l0 + (mod(l1 - l0 + 180, 360) - 180) * u, 360), d: Math.exp(Math.log(d0) * (1 - u) + Math.log(d1) * u) };
}
const planet = (L0, rate, a) => (n, ls) => helioToGeo(mod(L0 + rate * n, 360), a, ls);
const MERC = planet(252.25, 4.0923344, 0.3871), VENUS = planet(181.98, 1.6021302, 0.7233), MARS = planet(355.45, 0.5240208, 1.5237),
      JUP = planet(34.35, 0.0830853, 5.2026),    SAT = planet(50.08, 0.0334442, 9.5549),
      URA = planet(313.23, 0.0117258, 19.19),    NEP = planet(304.88, 0.0059810, 30.07),
      PLU = planet(238.9, 0.0039757, 39.48);     // Pluto: mean motion; true heliocentric distance in 2026 is ~35 AU (approx)

function sky(t, s) {
  const n = s.n, ls = s.lam, le = ls + 180;
  const days = (t - Date.parse('2026-11-14T00:00Z')) / 864e5;   // ~1 light-day mid-Nov 2026 (approx)
  const S = {
    // bodies
    SUN:  { kind: 'sun',    lam: ls, d: AU },
    MOON: { kind: 'moon',   lam: mod(218.316 + 13.176396 * n + 6.289 * Math.sin((134.963 + 13.064993 * n) * RAD), 360), d: 384400 },
    MERC: { kind: 'planet', ...MERC(n, ls),  col: '#b9b0a6', r: 1.9, label: 'mercury' },
    VENUS:{ kind: 'planet', ...VENUS(n, ls), col: '#f3e4bf', r: 2.6, label: 'venus' },
    MARS: { kind: 'planet', ...MARS(n, ls),  col: '#e2836a', r: 2.6, label: 'mars' },
    JUP:  { kind: 'planet', ...JUP(n, ls),   col: '#e6c79c', r: 4.2, label: 'jupiter' },
    SAT:  { kind: 'planet', ...SAT(n, ls),   col: '#e3d2a2', r: 3.4, label: 'saturn', ring: true },
    URA:  { kind: 'planet', ...URA(n, ls),   col: '#a9dbe3', r: 2.8, label: 'uranus' },
    NEP:  { kind: 'planet', ...NEP(n, ls),   col: '#7393ea', r: 2.8, label: 'neptune' },
    PLU:  { kind: 'planet', ...helioToGeo(mod(303 + 1.45 * (n - 9800) / 365.25, 360), 34.8, ls), col: '#d8c3a6', r: 1.6, label: 'pluto' },
    // spacecraft
    MMS2: { kind: 'craft', lam: ls + 140, d: 1.2e5 },
    SOHO: { kind: 'craft', lam: ls, d: 1.5e6 }, ACE: { kind: 'craft', lam: ls, d: 1.5e6 }, WIND: { kind: 'craft', lam: ls, d: 1.5e6 },
    JWST: { kind: 'craft', lam: le, d: 1.5e6 },
    ESCG: { kind: 'craft', lam: ls + 120, d: 6e6 },
    SPP:  { kind: 'craft', ...helioToGeo(le + 150, 0.5, ls) },
    STA:  { kind: 'craft', ...helioToGeo(le + 70, 0.96, ls) },
    VGR1: { kind: 'craft', lam: 255.5, d: 25.902e9 + days * 1.5e6 },
    VGR2: { kind: 'craft', lam: 290,   d: 2.11e10 },
    NHPC: { kind: 'craft', lam: 287,   d: 66 * AU },             // New Horizons
  };
  for (const [k, v] of Object.entries(S)) { const e = eph(k, t); if (e) Object.assign(v, e); }   // real positions where we have them
  return S;
}

// ======================= layout =======================
const cv = document.getElementById('c'), MAIN = cv.getContext('2d');
let ctx = MAIN;                                 // swapped while painting cached layers
let W, H, R, cx, cy, DPR;
let R0, RMAX, BACKDROP, STARS = [], EXOTIC = {};
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  R = Math.min(H * 0.12, W * 0.09);             // Earth in the middle, a little smaller
  cx = W / 2; cy = H / 2;
  R0 = R + 30;
  RMAX = Infinity;                              // one radius for all directions: isotropic log scale
  for (let th = 0; th < 360; th += 2) RMAX = Math.min(RMAX, edgeDist(th));
  buildBackdrop();
}

// true direction: the Sun is fixed to the right (0°); everything else sits at its ecliptic longitude
// relative to the Sun, counter-clockwise as seen from above the solar system
const trueAngle = (lam, ls) => mod(lam - ls + 180, 360) - 180;
function spreadAngles(S, ls) {                  // true angles, then a gentle nudge so nothing sits on top of anything else
  const ks = Object.keys(S), th = {}, r = {};
  for (const k of ks) { th[k] = trueAngle(S[k].lam, ls); r[k] = rOf(S[k].d); }
  const MIN = 46, MAXDEV = 25;
  for (let it = 0; it < 40; it++) {
    let moved = false;
    for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
      const a = ks[i], b = ks[j];
      const [ax, ay] = polar(th[a], r[a]), [bx, by] = polar(th[b], r[b]);
      const dd = Math.hypot(ax - bx, ay - by);
      if (dd >= MIN) continue;
      const push = (MIN - dd) / 2, da = mod(th[a] - th[b] + 180, 360) - 180 >= 0 ? 1 : -1;
      th[a] += da * push / Math.max(r[a], 1) / RAD; th[b] -= da * push / Math.max(r[b], 1) / RAD; moved = true;
    }
    for (const k of ks) { const t0 = trueAngle(S[k].lam, ls), dv = mod(th[k] - t0 + 180, 360) - 180;
      if (Math.abs(dv) > MAXDEV) th[k] = t0 + Math.sign(dv) * MAXDEV; }
    if (!moved) break;
  }
  return th;
}
function edgeDist(th) {
  const m = 70, c = Math.cos(th * RAD), s = Math.sin(th * RAD);

    }
    const pl = AUDIO.playing;
    if (pl && pl.clip && sec < pl.until && (pl.at || spot(pl.key))) {          // a quiet caption by the object while its clip plays
      const P = pl.at || spot(pl.key), f = Math.min(1, (pl.until - sec) / 2, (sec - pl.t0) / 1);
      ctx.font = FONT(10); ctx.fillStyle = `rgba(255,215,170,${0.6 * Math.max(0, f)})`; ctx.textAlign = 'center';
      ctx.fillText('♪ ' + (CLIP_TITLES[pl.clip] || pl.clip), P[0], P[1] + 32); ctx.textAlign = 'left';
    }
  }

  drawArecibo(sec);

  // ---- hover: names for the natural world
  if (MOUSE.on) {
    const all = HOVER.concat(EXOTIC.hover);
    let hit = null, best = 1e9;
    for (const h of all) { const dd = Math.hypot(h.x - MOUSE.x, h.y - MOUSE.y); if (dd < h.r && dd < best) { best = dd; hit = h; } }
    let name = hit && hit.name;
    if (!name && !frame.overSound) {
      const dist = Math.hypot(MOUSE.x - cx, MOUSE.y - cy);
      if (EXOTIC.arecibo && Math.hypot(MOUSE.x - EXOTIC.arecibo[0], MOUSE.y - EXOTIC.arecibo[1]) < 26 && ARECIBO.start === null)
        name = `the arecibo message · sent toward M13 in 1974, ${Math.round(EXOTIC.radioYears - 73)} light-years out`;
      else if (EXOTIC.rRadio && Math.abs(dist - EXOTIC.rRadio) < 8)
        name = `our first radio, 1901 · the edge of humanity's signals, ${EXOTIC.radioYears.toFixed(1)} light-years out`;
      else if (Math.abs(dist - EXOTIC.rHP) < 16) name = 'heliopause · where the sun\'s wind ends';
      else if (dist > EXOTIC.oort[0] && dist < EXOTIC.oort[1]) name = 'oort cloud';
      else if (dist > EXOTIC.rC) name = 'the oldest light · cosmic microwave background';
    }
    if (name) {
      ctx.font = FONT(11, 500);
      const tw = ctx.measureText(name).width, px = Math.min(W - tw - 24, MOUSE.x + 14), py = Math.max(24, MOUSE.y - 14);
      if (hit) { ctx.strokeStyle = 'rgba(230,225,255,0.35)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(hit.x, hit.y, 9, 0, 6.283); ctx.stroke(); }
      ctx.fillStyle = 'rgba(10,12,32,0.75)'; roundedRect(px - 8, py - 14, tw + 16, 22, 11); ctx.fill();
      ctx.fillStyle = 'rgba(235,232,250,0.9)'; ctx.fillText(name, px, py + 1);
    }
  }

}
const MOUSE = { x: 0, y: 0, on: false };
addEventListener('mousemove', e => { MOUSE.x = e.clientX; MOUSE.y = e.clientY; MOUSE.on = true; });
document.addEventListener('mouseleave', () => { MOUSE.on = false; });
addEventListener('blur', () => { MOUSE.on = false; });
addEventListener('resize', resize); resize();
initLaunches();
frame();
</script>
</body>
</html>
